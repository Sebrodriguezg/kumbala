<!doctype html>
<!-- Plantilla de imágenes para redes. La llena generar.py con los textos de dias.json
     (formato: estado 1080×1920 o publicación 1080×1080). -->
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --acento: #e0a05a; --fondo: #141317; --tinta: #f4f1ec; --suave: #d6d1c8; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--fondo); color: var(--tinta); font-family: 'Jost', sans-serif; overflow: hidden; position: relative; }
  .foto { position: absolute; left: 0; top: 0; width: 100%; object-fit: cover; }
  .velo { position: absolute; left: 0; top: 0; width: 100%; }
  .logo { position: absolute; filter: drop-shadow(0 4px 18px rgba(0,0,0,.8)); }
  .dia { letter-spacing: .5em; text-transform: uppercase; font-weight: 500; color: var(--acento); }
  .titulo { font-weight: 400; line-height: 1.05; }
  .titulo b { color: var(--acento); font-weight: 500; }
  .sub { font-weight: 300; color: var(--suave); }
  .qr { background: #fff; border-radius: 22px; box-shadow: 0 0 0 6px var(--acento); }
  .qr img { display: block; width: 100%; height: 100%; }
  .contacto span { color: var(--acento); font-weight: 500; }
  .lineas { position: absolute; inset: 0; pointer-events: none; }

  /* ---------- estado 1080×1920 */
  body.estado { width: 1080px; height: 1920px; }
  .estado .foto { height: 1120px; }
  .estado .velo { height: 1122px; background: linear-gradient(to bottom, rgba(20,19,23,.85) 0%, rgba(20,19,23,0) 22%, rgba(20,19,23,0) 55%, var(--fondo) 100%); }
  .estado .logo { width: 400px; left: 50%; transform: translateX(-50%); top: 50px; }
  .estado .texto { position: absolute; left: 70px; right: 70px; top: 960px; text-align: center; }
  /* fotos de grupo apaisadas: se muestran completas, en franja, debajo del logo */
  .estado.banda .foto { top: 250px; height: 640px; }
  .estado.banda .velo { top: 248px; height: 644px; background: linear-gradient(to bottom, var(--fondo) 0%, rgba(20,19,23,0) 12%, rgba(20,19,23,0) 75%, var(--fondo) 100%); }
  .estado.banda .texto { top: 930px; }
  .estado .dia { font-size: 30px; }
  .estado .titulo { font-size: 92px; margin-top: 24px; }
  .estado .sub { font-size: 38px; margin-top: 30px; line-height: 1.35; }
  .estado .pie { position: absolute; left: 70px; right: 70px; bottom: 90px; display: flex; align-items: center; gap: 44px; }
  .estado .qr { width: 270px; height: 270px; padding: 16px; flex: none; }
  .estado .contacto { font-size: 33px; line-height: 1.5; }
  .estado .contacto .grande { font-size: 40px; font-weight: 500; line-height: 1.15; margin-bottom: 14px; }
  .estado .contacto small { display: block; font-size: 27px; color: var(--suave); font-weight: 300; }

  /* ---------- publicación 1080×1080 */
  body.post { width: 1080px; height: 1080px; }
  .post .foto { height: 1080px; }
  .post .velo { height: 1080px; background: linear-gradient(to right, rgba(20,19,23,.96) 0%, rgba(20,19,23,.85) 42%, rgba(20,19,23,.15) 75%, rgba(20,19,23,0) 100%), linear-gradient(to top, rgba(20,19,23,.95) 0%, rgba(20,19,23,0) 30%); }
  .post .logo { width: 330px; left: 64px; top: 56px; }
  .post .texto { position: absolute; left: 70px; width: 600px; top: 330px; }
  .post .dia { font-size: 25px; }
  .post .titulo { font-size: 70px; margin-top: 18px; }
  .post .sub { font-size: 29px; margin-top: 22px; line-height: 1.35; }
  .post .pie { position: absolute; left: 70px; right: 64px; bottom: 56px; display: flex; align-items: flex-end; justify-content: space-between; }
  .post .qr { width: 170px; height: 170px; padding: 10px; border-radius: 16px; box-shadow: 0 0 0 4px var(--acento); }
  .post .contacto { font-size: 27px; line-height: 1.45; }
  .post .contacto .grande { display: none; }
  .post .contacto small { display: block; font-size: 23px; color: var(--suave); font-weight: 300; }
</style></head>
<body>
  <img class="foto" id="foto" alt="">
  <div class="velo"></div>
  <svg class="lineas" id="lineas" stroke="rgba(244,241,236,.16)" stroke-width="2"></svg>
  <img class="logo" src="../img/logo-kumbala.png" alt="">
  <div class="texto">
    <p class="dia" id="dia"></p>
    <h1 class="titulo" id="titulo"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="pie">
    <div class="contacto">
      <p class="grande">Escanea y<br>conoce la banda</p>
      <p>WhatsApp Julio <span>310 796 6440</span></p>
      <p>Llamadas <span>310 674 2026</span></p>
      <small>@kumbalamusic · sebrodriguezg.github.io/kumbala</small>
    </div>
    <div class="qr"><img src="qr-kumbala.png" alt=""></div>
  </div>
<script>
  const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.body.className = d.formato + (d.banda ? ' banda' : '');
  document.documentElement.style.setProperty('--acento', d.acento);
  const foto = document.getElementById('foto');
  foto.src = d.foto;
  foto.style.objectPosition = d.encuadre?.[d.formato] ?? 'center';
  if (d.sin_logo) document.querySelector('.logo').style.display = 'none';
  if (d.formato === 'post' && d.post_desplazar) foto.style.transform = `translateX(${d.post_desplazar})`;
  if (d.gris) foto.style.filter = 'grayscale(1) contrast(1.05)';
  document.getElementById('dia').textContent = d.dia;
  document.getElementById('titulo').innerHTML = d.titulo;
  document.getElementById('sub').textContent = d.sub;
  // líneas finas del press kit, en zonas que no tapan textos
  const [w, h] = d.formato === 'estado' ? [1080, 1920] : [1080, 1080];
  const L = d.formato === 'estado'
    ? [[40, 1180, 40, 1450], [1040, 1250, 1040, 1560], [150, 1880, 150, 1920], [880, 1150, 1080, 1150]]
    : [[1040, 40, 1040, 260], [700, 1040, 1080, 1040]];
  document.getElementById('lineas').setAttribute('viewBox', `0 0 ${w} ${h}`);
  document.getElementById('lineas').innerHTML = L.map(([a, b, c, e]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${e}"/>`).join('');
</script>
</body></html>
